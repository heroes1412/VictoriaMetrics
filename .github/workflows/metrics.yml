name: metrics
on:
  # Chạy tự động 0h00 ngày 1 hàng tháng (giờ UTC)
  schedule:
    - cron: '1 5 */5 * *'
  # Cho phép chạy thủ công bất cứ lúc nào trong tab Actions
  workflow_dispatch:

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.fetch.outputs.versions }}
      latest_version: ${{ steps.fetch.outputs.latest_version }}
    steps:
      - name: Fetch 3 latest VictoriaMetrics versions
        id: fetch
        run: |
          # Thêm Authorization token để tránh bị dính 403 GitHub API rate limit
          RELEASES_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/VictoriaMetrics/VictoriaMetrics/releases)
          
          # Lấy 3 version mới nhất (loại bỏ chữ 'v' ở đầu)
          #VERSIONS=$(echo "$RELEASES_JSON" | jq -c '[ .[] | select(.prerelease == false and .draft == false) | .tag_name | ltrimstr("v") ] | .[:4]')
          VERSIONS=$(echo "$RELEASES_JSON" | jq -c '[ .[] | select(.prerelease == false and .draft == false) | .tag_name ] | .[:3]')
          LATEST=$(echo "$VERSIONS" | jq -r '.[0]')

          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST" >> $GITHUB_OUTPUT
          echo "Top 3 VictoriaMetrics Versions: $VERSIONS"
          echo "Latest VictoriaMetrics Version: $LATEST"

  build-and-push:
    needs: get-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.get-versions.outputs.versions) }}
    # Thêm permissions để GitHub Actions có quyền đọc/ghi Release và Contents
    permissions:
      contents: write

    steps:
      # 1. Kiểm tra xem GitHub Release với version này đã tồn tại hay chưa
      - name: Check if Release Exists
        id: check_release
        run: |
          VERSION="${{ matrix.version }}"
          # Dùng GitHub CLI (gh) để kiểm tra release, nếu tồn tại trả về 0, ngược lại trả về khác 0
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION đã tồn tại. Bỏ qua các bước tiếp theo."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION chưa tồn tại. Tiếp tục tiến trình..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Tải file Dockerfile từ máy chủ riêng và thay thế tag version tương ứng
      - name: Download Remote Dockerfile
        if: steps.check_release.outputs.exists == 'false'
        run: |
          curl --retry 3 --retry-delay 2 --retry-connrefused -fSL "https://github.com/heroes1412/VictoriaMetrics/releases/download/tool/Dockerfile" -o Dockerfile
          sed -i "s|victoriametrics/victoria-metrics:latest|victoriametrics/victoria-metrics:${{ matrix.version }}-enterprise|g" Dockerfile
          echo "Đã tải và cập nhật Dockerfile cho version ${{ matrix.version }} thành công!"
          head -n 5 Dockerfile

      # 3. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Cài đặt QEMU hỗ trợ build multi-arch
      - name: Set up QEMU
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      # 5. Cài đặt Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # 6. Xác định Docker Tags (gắn tag :latest nếu là version mới nhất)
      - name: Determine Docker Tags
        if: steps.check_release.outputs.exists == 'false'
        id: docker_tags
        run: |
          VERSION="${{ matrix.version }}"
          LATEST="${{ needs.get-versions.outputs.latest_version }}"
          TAGS="h2372/victoriametrics-enterprise:${VERSION}-enterprise"
          if [ "$VERSION" = "$LATEST" ]; then
            TAGS="${TAGS},h2372/victoriametrics-enterprise:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Generated Docker Tags: $TAGS"

      # 7. Build và Push đa kiến trúc lên Docker Hub với tag là version tương ứng
      - name: Build and push Docker image
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_tags.outputs.tags }}

      # 8. Trích xuất file binary từ Image cho cả 2 kiến trúc (amd64 và arm64) với tên tùy biến
      - name: Extract binaries from Docker image
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ matrix.version }}"
          IMAGE="h2372/victoriametrics-enterprise:${VERSION}-enterprise"

          echo "Trích xuất binary cho linux/amd64..."
          docker create --name temp_amd64 --platform linux/amd64 $IMAGE
          docker cp temp_amd64:/victoria-metrics-prod ./victoria-metrics-linux-amd64-${VERSION}-enterprise
          docker rm temp_amd64

          echo "Trích xuất binary cho linux/arm64..."
          docker create --name temp_arm64 --platform linux/arm64 $IMAGE
          docker cp temp_arm64:/victoria-metrics-prod ./victoria-metrics-linux-arm64-${VERSION}-enterprise
          docker rm temp_arm64

          chmod +x ./victoria-metrics-linux-amd64-${VERSION}-enterprise ./victoria-metrics-linux-arm64-${VERSION}-enterprise
          ls -lh ./victoria-metrics-linux-amd64-${VERSION}-enterprise ./victoria-metrics-linux-arm64-${VERSION}-enterprise

      # 9. Tải, patch và đóng gói cluster binaries (vminsert, vmselect, vmstorage)
      - name: Process and patch cluster binaries
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ matrix.version }}"

          for ARCH in amd64 arm64; do
            echo "=================================================="
            echo "Đang xử lý cluster binary cho kiến trúc $ARCH..."
            echo "=================================================="

            echo "Tải công cụ patch..."
            curl --retry 3 --retry-delay 2 --retry-connrefused -fSL "https://github.com/heroes1412/VictoriaMetrics/releases/download/tool/victoria-enterprise-lite-linux-${ARCH}" -o "./victoria-enterprise-lite-linux-${ARCH}"
            chmod +x "./victoria-enterprise-lite-linux-${ARCH}"

            TAR_NAME="victoria-metrics-linux-${ARCH}-${VERSION}-enterprise-cluster.tar.gz"
            URL="https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/${VERSION}/${TAR_NAME}"
            echo "Tải cluster archive: $URL"
            curl --retry 3 --retry-delay 2 --retry-connrefused -fSL "$URL" -o "$TAR_NAME"

            mkdir -p "cluster_${ARCH}"
            tar -xzf "$TAR_NAME" -C "cluster_${ARCH}"

            echo "Thực hiện patch vminsert-prod, vmselect-prod, vmstorage-prod..."
            ./victoria-enterprise-lite-linux-${ARCH} patch "./cluster_${ARCH}/vminsert-prod"
            ./victoria-enterprise-lite-linux-${ARCH} patch "./cluster_${ARCH}/vmselect-prod"
            ./victoria-enterprise-lite-linux-${ARCH} patch "./cluster_${ARCH}/vmstorage-prod"

            rm -f "$TAR_NAME"
            tar -czf "$TAR_NAME" -C "cluster_${ARCH}" vminsert-prod vmselect-prod vmstorage-prod
            rm -rf "cluster_${ARCH}" "./victoria-enterprise-lite-linux-${ARCH}"
            echo "Đã đóng gói thành công $TAR_NAME"
          done

      # 10. Tự động tạo Git Tag và GitHub Release tương ứng với version 
      - name: Create GitHub Release and Tag
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.version }}
          name: Metrics ${{ matrix.version }}
          body: |
            Job Done:
            - **VictoriaMetrics Version**: `${{ matrix.version }}`
            - **Docker Image**: `h2372/victoriametrics-enterprise:${{ matrix.version }}-enterprise`
            - **Single Binaries**:
              - `victoria-metrics-linux-amd64-${{ matrix.version }}-enterprise`
              - `victoria-metrics-linux-arm64-${{ matrix.version }}-enterprise`
            - **Cluster Binaries**:
              - `victoria-metrics-linux-amd64-${{ matrix.version }}-enterprise-cluster.tar.gz`
              - `victoria-metrics-linux-arm64-${{ matrix.version }}-enterprise-cluster.tar.gz`
          files: |
            victoria-metrics-linux-amd64-${{ matrix.version }}-enterprise
            victoria-metrics-linux-arm64-${{ matrix.version }}-enterprise
            victoria-metrics-linux-amd64-${{ matrix.version }}-enterprise-cluster.tar.gz
            victoria-metrics-linux-arm64-${{ matrix.version }}-enterprise-cluster.tar.gz
          draft: false
          prerelease: false
