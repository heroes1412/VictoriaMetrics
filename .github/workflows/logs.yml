name: logs

on:
  # Chạy tự động 0h00 ngày 1 hàng tháng (giờ UTC)
  schedule:
    - cron: '1 7 */7 * *'
  # Cho phép chạy thủ công bất cứ lúc nào trong tab Actions
  workflow_dispatch:

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.fetch.outputs.version }}
    steps:
      - name: Fetch latest VictoriaLogs version
        id: fetch
        run: |
          # Thêm Authorization token để tránh bị dính 403 GitHub API rate limit
          RELEASES_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/VictoriaMetrics/VictoriaLogs/releases)
          
          # Lấy 1 version mới nhất (không phải draft / prerelease)
          LATEST=$(echo "$RELEASES_JSON" | jq -r '[ .[] | select(.prerelease == false and .draft == false) | .tag_name ][0]')

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Error: Could not fetch latest version"
            exit 1
          fi

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest VictoriaLogs Version: $LATEST"

  build-and-push:
    needs: get-versions
    runs-on: ubuntu-latest
    # Thêm permissions để GitHub Actions có quyền đọc/ghi Release và Contents
    permissions:
      contents: write

    steps:
      # 1. Kiểm tra xem GitHub Release với version này đã tồn tại hay chưa
      - name: Check if Release Exists
        id: check_release
        run: |
          VERSION="${{ needs.get-versions.outputs.version }}"
          # Dùng GitHub CLI (gh) để kiểm tra release, nếu tồn tại trả về 0, ngược lại trả về khác 0
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $VERSION đã tồn tại. Bỏ qua các bước tiếp theo."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $VERSION chưa tồn tại. Tiếp tục tiến trình..."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Tải file Dockerfile từ máy chủ riêng và thay thế tag version tương ứng
      - name: Download Remote Dockerfile
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ needs.get-versions.outputs.version }}"
          curl --retry 3 --retry-delay 2 --retry-connrefused -fSL "https://github.com/heroes1412/VictoriaMetrics/releases/download/tool/Dockerfile-log" -o Dockerfile
          sed -i "s|victoriametrics/victoria-logs:latest|victoriametrics/victoria-logs:${VERSION}-enterprise|g" Dockerfile
          echo "Đã tải và cập nhật Dockerfile cho version $VERSION thành công!"
          head -n 5 Dockerfile

      # 3. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Cài đặt QEMU hỗ trợ build multi-arch
      - name: Set up QEMU
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      # 5. Cài đặt Docker Buildx
      - name: Set up Docker Buildx
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # 6. Xác định Docker Tags (gắn tag :latest cho version mới nhất)
      - name: Determine Docker Tags
        if: steps.check_release.outputs.exists == 'false'
        id: docker_tags
        run: |
          VERSION="${{ needs.get-versions.outputs.version }}"
          TAGS="h2372/victorialogs-enterprise:${VERSION}-enterprise,h2372/victorialogs-enterprise:latest"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Generated Docker Tags: $TAGS"

      # 7. Build và Push đa kiến trúc lên Docker Hub với tag là version tương ứng
      - name: Build and push Docker image
        if: steps.check_release.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_tags.outputs.tags }}

      # 8. Trích xuất file binary từ Image cho cả 2 kiến trúc (amd64 và arm64) với định dạng chuẩn
      - name: Extract binaries from Docker image
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ needs.get-versions.outputs.version }}"
          IMAGE="h2372/victorialogs-enterprise:${VERSION}-enterprise"

          echo "Trích xuất binary cho linux/amd64..."
          docker create --name temp_amd64 --platform linux/amd64 $IMAGE
          docker cp temp_amd64:/victoria-logs-prod ./victoria-logs-linux-amd64-${VERSION}-enterprise
          docker rm temp_amd64

          echo "Trích xuất binary cho linux/arm64..."
          docker create --name temp_arm64 --platform linux/arm64 $IMAGE
          docker cp temp_arm64:/victoria-logs-prod ./victoria-logs-linux-arm64-${VERSION}-enterprise
          docker rm temp_arm64

          chmod +x ./victoria-logs-linux-amd64-${VERSION}-enterprise ./victoria-logs-linux-arm64-${VERSION}-enterprise
          ls -lh ./victoria-logs-linux-amd64-${VERSION}-enterprise ./victoria-logs-linux-arm64-${VERSION}-enterprise

      # 9. Tự động tạo Git Tag và GitHub Release tương ứng với version 
      - name: Create GitHub Release and Tag
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-versions.outputs.version }}
          name: Logs ${{ needs.get-versions.outputs.version }}
          body: |
            Job Done:
            - **VictoriaLogs Version**: `${{ needs.get-versions.outputs.version }}`
            - **Docker Image**: `h2372/victorialogs-enterprise:${{ needs.get-versions.outputs.version }}-enterprise`
            - **Binaries**:
              - `victoria-logs-linux-amd64-${{ needs.get-versions.outputs.version }}-enterprise`
              - `victoria-logs-linux-arm64-${{ needs.get-versions.outputs.version }}-enterprise`
          files: |
            victoria-logs-linux-amd64-${{ needs.get-versions.outputs.version }}-enterprise
            victoria-logs-linux-arm64-${{ needs.get-versions.outputs.version }}-enterprise
          draft: false
          prerelease: false
